name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "chore/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Flutter project
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "has_flutter=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_flutter=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.has_flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter pub get

      - name: Static analysis
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter analyze

      - name: Format check
        if: steps.detect.outputs.has_flutter == 'true'
        run: dart format --set-exit-if-changed .

      - name: Tests
        if: steps.detect.outputs.has_flutter == 'true'
        run: flutter test

      - name: Secret scan (Dart source)
        if: steps.detect.outputs.has_flutter == 'true'
        run: |
          if [ -d "lib" ]; then
            ! grep -rn "sk-\|apiKey\s*=\s*['\"].\|supabaseKey\s*=\s*['\"]" --include="*.dart" lib/
          else
            echo "No lib/ directory yet; skipping Dart secret scan."
          fi

      - name: Skip note
        if: steps.detect.outputs.has_flutter != 'true'
        run: echo "pubspec.yaml not found. Flutter checks skipped."

